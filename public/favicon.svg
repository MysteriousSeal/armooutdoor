<svg xmlns="http://www.w3.org/2000/svg" viewBox="23 20 1362 1368">
  <!--
    The shop's mark at tab size. No ground, so it sits on whatever the
    browser paints behind it, and the A follows the chrome instead of
    disappearing into it: dark on a light tab strip, light on a dark one.
    The ring keeps its taupe, which reads on both.
  -->
  <style>
    .ink { fill: #282828 }
    @media (prefers-color-scheme: dark) { .ink { fill: #eceae6 } }
  </style>
  <path class="ink" d="M704 97l423 769H1013L704 304 395 866H281Z"/>
  <rect class="ink" x="43" y="605" width="1322" height="92"/>
  <circle cx="704" cy="1010.5" r="264.5" fill="none" stroke="#887868" stroke-width="63"/>
</svg>
